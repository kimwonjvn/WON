<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6CC3F7"/>
      <stop offset="100%" stop-color="#2F8FDD"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9E2FF"/>
      <stop offset="100%" stop-color="#55B8F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <g transform="translate(0,-8)">
    <!-- ground shadow -->
    <ellipse cx="256" cy="448" rx="180" ry="18" fill="#0B3A66" opacity="0.28" filter="url(#soft)"/>

    <!-- back panel with tab -->
    <path d="M90 100 H190 C202 100 211 104 219 112 L233 126 C240 133 248 136 258 136 H422 C441 136 456 151 456 170 V400 C456 419 441 434 422 434 H90 C71 434 56 419 56 400 V134 C56 115 71 100 90 100 Z" fill="url(#back)"/>

    <!-- front panel -->
    <rect x="56" y="168" width="400" height="266" rx="32" fill="url(#front)"/>
    <!-- top edge highlight -->
    <path d="M88 169.5 H424" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- faint W: soft engraved look -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
      <polyline points="170,268 213,352 256,296 299,352 342,268" stroke="#1F78C4" opacity="0.22" transform="translate(0,-2.5)" filter="url(#blur1)"/>
      <polyline points="170,268 213,352 256,296 299,352 342,268" stroke="#FFFFFF" opacity="0.5" transform="translate(0,1.5)"/>
    </g>
  </g>
</svg>
